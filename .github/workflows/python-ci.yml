name: python-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal checks
        run: |
          python -m pip install --upgrade pip
          pip install black==23.3.0
      - name: Check format
        run: |
          black --check script

